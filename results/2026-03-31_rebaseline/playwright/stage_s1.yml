          - generic [ref=e21]:
            - heading "About Anthropic" [level=2] [ref=e22]:
              - strong [ref=e23]: About Anthropic
            - paragraph [ref=e24]: Anthropic’s mission is to create reliable, interpretable, and steerable AI systems. We want AI to be safe and beneficial for our users and for society as a whole. Our team is a quickly growing group of committed researchers, engineers, policy experts, and business leaders working together to build beneficial AI systems.
          - generic [ref=e25]:
            - heading "About the role:" [level=2] [ref=e26]:
              - strong [ref=e27]: "About the role:"
            - paragraph [ref=e28]:
              - link "Agentic systems" [ref=e29] [cursor=pointer]:
                - /url: https://www.anthropic.com/research/building-effective-agents
              - text: are becoming an increasingly important part of how AI is deployed. Over the last year, we’ve seen rapid adoption of Claude-powered agentic systems in spaces like coding, research, customer support, network security, and more. We believe this is just the beginning, and we expect Claude to be handling much more complex tasks end-to-end or in cooperation with a human user as time goes on. We have a team striving to make Claude an even more effective agent over longer time horizon tasks, and coordinate with groups of other agents at many different scales to accomplish large tasks. This team endeavors to maximize agent performance by solving challenges at whatever level is needed, whether it’s novel harness design, improved agent affordances and infrastructure, or finetuning.
            - paragraph [ref=e30]: "Given that this is a nascent field, we ask that you share with us a project built on LLMs that showcases your skill at getting them to do complex tasks. Here are some example projects of interest: design of complex agents, quantitative experiments with prompting, constructing model benchmarks, synthetic data generation, or model finetuning. There is no preferred task; we just want to see what you can build. It’s fine if several people worked on it; simply share what part of it was your contribution. You can also include a short description of the process you used or any roadblocks you hit and how to deal with them, but this is not a requirement."
            - heading [level=3] [ref=e31]:
              - strong [ref=e32]
            - heading "Responsibilities:" [level=3] [ref=e33]:
              - strong [ref=e34]: "Responsibilities:"
            - list [ref=e35]:
              - listitem [ref=e36]: Ideate, develop, and compare the performance of different agent harnesses (eg memory, context compression, communication architectures for agents)
              - listitem [ref=e37]: Design and implement rigorous quantitative benchmarks for large scale agentic tasks
              - listitem [ref=e38]: Assist with automated evaluation of Claude models and prompts across the training and product lifecycle
              - listitem [ref=e39]: Work with our product org to find solutions to our most vexing challenges applying agents to our products
              - listitem [ref=e40]: Help create and optimize data mixes for model training that maximize Claude’s performance or ease of use on agentic tasks
            - heading "You may be a good fit if you:" [level=3] [ref=e41]:
              - strong [ref=e42]: "You may be a good fit if you:"
            - list [ref=e43]:
              - listitem [ref=e44]: Have experience developing complex agentic systems using LLMs
              - listitem [ref=e45]: Have significant software engineering and ML experience
              - listitem [ref=e46]: Have spent time prompting and/or building products with language models
              - listitem [ref=e47]: Have good communication skills and an interest in working with other researchers on difficult tasks
              - listitem [ref=e48]: Have a passion for making powerful technology safe and societally beneficial
              - listitem [ref=e49]: Stay up-to-date and informed by taking an active interest in emerging research and industry trends.
              - listitem [ref=e50]: Enjoy pair programming (we love to pair!)
            - heading "Strong candidates may also have experience with:" [level=3] [ref=e51]:
              - strong [ref=e52]: "Strong candidates may also have experience with:"
            - list [ref=e53]:
              - listitem [ref=e54]: Large-scale RL on language models
              - listitem [ref=e55]: Multi-agent systems
            - heading "Representative projects:" [level=3] [ref=e56]:
              - strong [ref=e57]: "Representative projects:"
            - list [ref=e58]:
              - listitem [ref=e59]: Design and build a novel agent harness that outperforms existing agents on coding or knowledge work benchmarks
              - listitem [ref=e60]: Design and build agent affordances that unlock new capabilities for internal use and deployed products
              - listitem [ref=e61]: Design and build a novel eval that measures how many agents interact in groups to solve problems
              - listitem [ref=e62]: Build a scaled model evaluation framework driven by model-based evaluation techniques.
              - listitem [ref=e63]: Build the prompting and model orchestration for a production application backed by a language model
              - listitem [ref=e64]: Finetune Claude to maximize its performance using a particular set of agent tools or harness
