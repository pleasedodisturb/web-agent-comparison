        - tabpanel "Overview" [ref=e41]:
          - generic [ref=e42]:
            - paragraph [ref=e43]: Replit is the agentic software creation platform that enables anyone to build applications using natural language. With millions of users worldwide, Replit is democratizing software development by removing traditional barriers to application creation.
            - paragraph [ref=e44]
            - heading "About the Role" [level=2] [ref=e45]:
              - strong [ref=e46]: About the Role
            - paragraph [ref=e47]: We're looking for a senior, deeply technical TPM to own delivery of Replit's highest-stakes, most complex programs—starting with our evergreen Agent roadmaps. This is an IC role for someone who has previously been an engineering manager or senior engineer, can operate comfortably in AI/LLM-heavy systems, and brings order, momentum, and sharp decision-making to cross-team ambiguity. The ideal candidate uses AI and automation aggressively to scale themselves, but understands that the core value is clarity, tradeoffs, and execution, not just tooling.
            - heading "You Will" [level=2] [ref=e48]:
              - strong [ref=e49]: You Will
            - list [ref=e50]:
              - listitem [ref=e51]:
                - paragraph [ref=e52]: Own end-to-end delivery of Replit's most complex, cross-functional programs, with Agent development as the primary, evergreen focus
              - listitem [ref=e53]:
                - paragraph [ref=e54]: Drive execution across Product, Eng, Research, GTM, and Leadership—surfacing dependencies, risks, and disagreements early
              - listitem [ref=e55]:
                - paragraph [ref=e56]: "Operate as the technical glue between teams: able to follow architecture decisions, challenge assumptions, and translate tradeoffs without slowing velocity"
              - listitem [ref=e57]:
                - paragraph [ref=e58]: Establish and run program operating cadence (milestones, reviews, decision logs, retros) for long-running bets
              - listitem [ref=e59]:
                - paragraph [ref=e60]: Use AI, automation, and agent workflows to scale program management (status synthesis, risk detection, incident follow-ups, guardrails, retros)
              - listitem [ref=e61]:
                - paragraph [ref=e62]: Take on additional high-stakes programs as needed (e.g. Enterprise initiatives, external integrations, priority conflicts)
              - listitem [ref=e63]:
                - paragraph [ref=e64]: Partner closely with EMs and PMs without duplicating their roles—this role exists where ownership is otherwise fragmented
            - heading "Required skills and experience" [level=2] [ref=e65]:
              - strong [ref=e66]: Required skills and experience
            - list [ref=e67]:
              - listitem [ref=e68]:
                - paragraph [ref=e69]: 8+ years of TPM experience (or equivalent) with a track record of leading complex, high-impact programs
              - listitem [ref=e70]:
                - paragraph [ref=e71]: Deep technical fluency in systems like distributed architecture, infrastructure, platform engineering, or AI/ML
              - listitem [ref=e72]:
                - paragraph [ref=e73]: Clear, direct communication style with strong decision-making skills
              - listitem [ref=e74]:
                - paragraph [ref=e75]: Thrives in ambiguity and can drive progress independently—this is a high-impact IC role, not the foundation of a TPM organization
            - heading "Preferred Qualifications" [level=2] [ref=e76]:
              - strong [ref=e77]: Preferred Qualifications
