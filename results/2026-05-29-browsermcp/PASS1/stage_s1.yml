# Why the extraction is empty:
finding: |
  Greenhouse ships the snapshot as SSR HTML (job data IS embedded in the file
  at fixtures/snapshots/greenhouse_2026-05-22/anthropic/jobs/5023394008.html) PLUS
  a React mount point. When Chrome executes the bundled React app, it tries to
  re-fetch the job from a backend endpoint that does not exist on the local
  snapshot server, and falls back to Greenhouse's "no longer active" 404 view.
  The DOM is replaced before BrowserMCP captures the accessibility snapshot.

  BrowserMCP is a thin wrapper over the real Chrome tab — there is no
  "disable JS" or "fetch raw HTML" surface on this MCP — so what Chrome
  renders is what gets scored. This is the SAME failure mode that
  Playwright / chrome-devtools-mcp would exhibit on this fixture; the
  data is only recoverable for MCPs that skip JS execution
  (lightpanda) or that bypass the React refetch (server-side scrapers
  like Firecrawl reading the SSR shell).

