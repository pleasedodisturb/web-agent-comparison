root_cause: |
  The captured Ashby snapshot is the SPA *loader shell only* — a 6.3 KB
  HTML scaffold whose body is literally "You need to enable JavaScript to
  run this app." Inline JS sets `window.__appData = { ..., posting: null,
  jobBoard: null, ... }` and then fetches the bundle manifest from
  `https://cdn.ashbyprd.com/frontend_non_user/.../manifest.json`.

  The job content has never been serialized into the HTML — it would
  normally arrive via a runtime API call from the React bundle. Both the
  bundle CDN and the data API are unreachable offline, so even a full
  JS-rendering browser ends up at Ashby's client-side "Page not found"
  state with no job content to extract.

playwright_can_render_js: true
playwright_extracted_meaningful_content: false

why_this_matters: |
  This is a *snapshot fidelity* failure rather than a Playwright capability
  failure. Playwright correctly hydrated the SPA and reported the
  observable end state (Page not found). A non-rendering MCP (e.g.
  Lightpanda) would return the 6 KB loader shell text verbatim — visibly
  "more content" but equally useless for benchmark scoring.

  For honest scoring: Playwright's S2 outcome is "rendered, payload empty
  by design of the snapshot" — distinguish from "rendered, payload present
  but extraction failed" and from "could not render JS at all."

