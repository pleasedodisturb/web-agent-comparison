stage: S1
mcp: playwright
target: http://127.0.0.1:8765/greenhouse_2026-05-22/anthropic/jobs/5023394008.html

extraction_strategy: |
  Greenhouse runs a Next.js SPA that on hydration tried to refetch from the
  live backend (job-boards.greenhouse.io); when offline, it wipes the body
  and renders "Page not found". So `browser_snapshot` after navigation is
  unreliable. The reliable Playwright-native extraction path is
  `browser_evaluate` with `fetch()` + `DOMParser` over the served HTML —
  that bypasses React hydration and reads the raw SSR HTML the snapshot
  server returned.

