notes:
  - The fixture HTML is a 84,577-byte snapshot whose static body contains the full job
    posting. The included React shell then hydrates against a stale Greenhouse API and
    replaces the visible body with "Page not found — The job board you were viewing is
    no longer active."
  - cloak_read_page() and cloak_snapshot() against the live DOM both returned only the
    post-hydration "Page not found" stub.
  - Workaround uses cloak_evaluate() to refetch the same URL via fetch() and parse via
    DOMParser before React ever touches the document. This is a legitimate primitive
    exposed by the MCP and yields the metadata Greenhouse would normally render
    server-side / on a non-stale React build.
  - The Apply <button> has no href; the in-body "Apply using this link" and "Apply here"
    anchors both point to https://bit.ly/afpsafety, which is the real apply URL.
