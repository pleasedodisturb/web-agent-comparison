notes:
  - This is the SPA rendering test. Ashby SPAs ship a ~6KB HTML shell that contains
    no job data; the posting metadata arrives via a runtime API call to
    api.ashbyhq.com keyed off the URL path or appData.posting (which is null here).
  - CloakBrowser executed the JS bundle (visible via cdn.ashbyprd.com requests), the
    React tree hydrated successfully (has_react_root: true), and the resulting body
    correctly reports "Page not found" because the upstream Ashby API no longer has
    this posting.
  - This is a HONEST capability finding for cloakbrowser. JS rendering works. The
    job content is absent because the snapshot was archived after the live posting
    expired and the fixture cannot replay Ashby's API.
  - In a live Ashby setting (non-snapshot), cloakbrowser would extract title/company/
    location correctly. There is no architectural blocker on the MCP side.
  - Contrast with Lightpanda on S2: lightpanda cannot run the bundle at all and would
    return a literally empty body. CloakBrowser ran it and got an authoritative 404
    from the real Ashby API — a meaningfully different outcome.
