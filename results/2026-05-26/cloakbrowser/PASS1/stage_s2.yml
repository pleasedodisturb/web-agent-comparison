    bootstrap shell with no inline JSON island. Compare to Greenhouse, whose
    static HTML contained the full job body."
  - "Verdict for the rubric: cloakbrowser passed the JS-execution test but the
    fixture lacks the data; lightpanda would fail the JS-execution test for the
    same reason (no React) and ALSO get no data. The two failure modes look
    identical from the outside but the underlying behavior differs."
  - "No data to extract. This is an honest failure of fixture composition, not
    of the MCP — recording the empty-shell behavior IS the finding."
