notes:
  - "This is the canonical Ashby SPA-rendering test. CloakBrowser DOES execute
    JavaScript (full source-patched Chromium), so unlike a static fetcher it
    DID hydrate the SPA. The SPA reached out to Ashby's live API (api.ashbyhq.com
    or similar), got no data for this job ID against the local fixture host,
    and rendered its built-in 'Page not found' fallback."
