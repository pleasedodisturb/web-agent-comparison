mcp: chrome-devtools

# Ashby is a client-side React SPA hosted under jobs.ashbyhq.com. Unlike
# Greenhouse's Remix SSR (which embeds the full post in window.__remixContext),
# Ashby fetches posting data via an authenticated GraphQL call AFTER hydration.
# The static HTML captured by wget therefore contains NO posting data —
# window.__appData.posting is null in the source.

rendered_dom:
