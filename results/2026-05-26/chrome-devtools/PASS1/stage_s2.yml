  organization: null
  posting: null
  jobBoard: null
  environment: production
  routerPrefix: "/"
  note: "All four data slots are null in source HTML — Ashby fetches post-hydration via GraphQL"

extracted_job_data:
  title: null
  company: null   # likely "Replit" based on URL path
  company_from_url_path: replit
  location: null
  role_summary: null

tools_used:
  - mcp__chrome-devtools__navigate_page
  - mcp__chrome-devtools__evaluate_script

result: empty_extraction
reason: >
  Chrome-devtools successfully rendered the SPA (React mounted, "Page not
  found" component displayed). But the posting fields in window.__appData
  are null in the captured HTML — Ashby's SSR shipped an empty shell
  expecting the client to GraphQL-fetch the post. Since the snapshot has no
  GraphQL backend, no data hydrates. Only the company slug ("replit") can
  be inferred from the URL path.

caveats: >
  This is NOT a chrome-devtools rendering failure — JS executed correctly.
  It is a fixture limitation: the wget capture froze the Ashby app at the
  moment before the GraphQL call resolved, so the structured data was never
  in the bytes. A live Ashby URL would have populated window.__appData via
  client-side fetch, but live fixtures rot (Pitfall 8 — captured snapshots
  are the test target by design).
