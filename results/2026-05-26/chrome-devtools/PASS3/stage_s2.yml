mcp_capability_finding: |
  - Chrome JS engine + DevTools protocol: PASS (renders SPA, hydrates, runs network)
  - Ability to extract from this specific fixture: 0 bytes of job data, because the fixture
    has 0 bytes of job data. Not an MCP defect.
  - Contrast vs. a renderless MCP (e.g. lightpanda, firecrawl no-JS mode): they would see the
    raw HTML shell ("You need to enable JavaScript to run this app") instead of the rendered
    "Page not found" — neither has job data.
