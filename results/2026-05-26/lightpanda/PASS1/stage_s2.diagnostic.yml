findings: |
  Ashby is a React SPA served as a thin SSR shell + a client bundle.
  Lightpanda is a headless browser built on the Zig 'Browsercore' engine that
  intentionally does NOT implement a full JS runtime (no V8/SpiderMonkey).
  React's client-side hydration step fails silently — the page object exists,
  the <script> tags load, but the components never mount into #root.

  This is the diagnostic finding for Lightpanda on this benchmark dimension:
  it is suitable for static HTML and server-rendered content (S1 worked
  perfectly), but it cannot extract any job data from Ashby-style SPAs.

  Documented openly rather than masked — this is the expected behavior on the
  rubric's "SPA rendering" axis.
