[project]
name = "web-agent-comparison-harness"
version = "0.1.0"
description = "Harness for the web-agent MCP comparison benchmark (Stage 1 of the 3-stage pipeline)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.23.0,<1.24",
    "anthropic>=0.40,<0.50",
    "httpx>=0.28",
    "tiktoken>=0.7",
    # PII scrub (bench/scrub_artifacts.py) — OCR backend. The system
    # `tesseract` binary is required for image scanning; if absent the
    # script falls back to text-only mode (see bench/scrub_artifacts.py
    # module docstring).
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
